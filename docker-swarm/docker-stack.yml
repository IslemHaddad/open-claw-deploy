version: '3.9'

services:
  openclaw:
    image: ${OPENCLAW_IMAGE}
    ports:
      - target: 3000
        published: ${OPENCLAW_PORT}
        protocol: tcp
        mode: ingress
    deploy:
      replicas: ${REPLICAS}
      restart_policy:
        condition: on-failure
    networks:
      - openclaw_net

networks:
  openclaw_net:
    driver: overlay
